name: build

# Private repo: Actions minutes are limited, so build only PRs and main
# (not every branch push), cancel superseded runs, and run the Windows (MSVC)
# job only when started by hand (Actions > build > Run workflow), since
# Windows minutes count double. The mingw job is the one that ships.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Win32)
        run: cmake -S code -B build -A Win32
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: MCM2MaX-msvc
          path: |
            build/Release/MCM2MaX.dll
            tools/mcm2patch.py

  mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686 cmake zip
      - name: Test SSE2 kernels against the plain ones
        run: g++ -O2 -std=c++17 -msse2 -Icode/src code/tests/simd_test.cpp code/src/simd_plain.cpp code/src/simd_sse2.cpp -o simd_test && ./simd_test
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-work/install
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Build FFmpeg (Indeo 5 decoder only)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh ffmpeg-work
      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: sdl3-work/install
          key: sdl3-${{ hashFiles('tools/build-sdl3.sh', 'code/toolchain-mingw32.cmake') }}
      - name: Build SDL3 (controllers only)
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: tools/build-sdl3.sh sdl3-work
      - name: Cache RmlUi
        id: rmlui-cache
        uses: actions/cache@v4
        with:
          path: rmlui-work/install
          key: rmlui-${{ hashFiles('tools/build-rmlui.sh', 'code/toolchain-mingw32.cmake') }}
      - name: Build RmlUi + FreeType (MenuMaX screens)
        if: steps.rmlui-cache.outputs.cache-hit != 'true'
        run: tools/build-rmlui.sh rmlui-work
      - name: Configure
        run: cmake -S code -B build -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/code/toolchain-mingw32.cmake -DCMAKE_BUILD_TYPE=Release -DMCM2MaX_FFMPEG=$GITHUB_WORKSPACE/ffmpeg-work/install -DMCM2MaX_SDL3=$GITHUB_WORKSPACE/sdl3-work/install -DMCM2MaX_RMLUI=$GITHUB_WORKSPACE/rmlui-work/install
      - name: Build
        run: cmake --build build
      - name: Check Windows XP imports
        run: python3 tools/check-xp-imports.py build/MCM2MaX.dll
      - name: Package
        run: tools/package.sh build/MCM2MaX.dll MCM2MaX.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MCM2MaX-release
          path: MCM2MaX.zip
      - name: Build mcm2sky (sky box tool)
        run: i686-w64-mingw32-g++ -O2 -std=c++17 -static -s -o mcm2sky.exe tools/mcm2sky/mcm2sky.cpp
      - uses: actions/upload-artifact@v4
        with:
          name: mcm2sky
          path: |
            mcm2sky.exe
            tools/mcm2sky/README.md
      - name: Build mcm2dat (menu archive unpacker)
        run: i686-w64-mingw32-g++ -O2 -std=c++17 -static -s -o mcm2dat.exe tools/mcm2dat/mcm2dat.cpp
      - uses: actions/upload-artifact@v4
        with:
          name: mcm2dat
          path: |
            mcm2dat.exe
            tools/mcm2dat/README.md
