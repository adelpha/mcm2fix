name: build

on:
  push:
  pull_request:

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Win32)
        run: cmake -S code -B build -A Win32
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: mcm2fix-msvc
          path: |
            build/Release/mcm2fix.dll
            tools/mcm2patch.py

  mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686 cmake
      - name: Configure
        run: cmake -S code -B build -DCMAKE_TOOLCHAIN_FILE=code/toolchain-mingw32.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
